{% extends "base.html" %}
{% block title %}حساب جديد{% endblock %}
{% block content %}
<section class="auth panel">
  <h1>إنشاء حساب</h1>
  {% if first %}<p class="flash flash-ok">لا يوجد أي حساب بعد: أول حساب يُنشأ يصبح مدير الموقع.</p>{% endif %}
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field">الاسم الكامل <input type="text" name="name" required maxlength="80" value="{{ request.form.get('name', '') }}"></label>
    <label class="field">اسم المستخدم (حروف إنجليزية وأرقام) <input type="text" name="username" required maxlength="40" autocomplete="username" dir="ltr" value="{{ request.form.get('username', '') }}"></label>
    <label class="field">كلمة المرور (8 أحرف على الأقل) <input type="password" name="password" required minlength="8" autocomplete="new-password" dir="ltr"></label>
    <label class="field">تأكيد كلمة المرور <input type="password" name="confirm" required minlength="8" autocomplete="new-password" dir="ltr"></label>
    <button class="btn btn-primary" type="submit">إنشاء الحساب</button>
  </form>
  <p class="muted">لديك حساب؟ <a href="{{ url_for('login') }}">سجّل الدخول</a></p>
</section>
{% endblock %}
