{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<section class="auth panel">
  <h1>تسجيل الدخول</h1>
  <p class="muted">صفحات النظام (المراقبة والمختبر وبياناتك والسجلات) تحتاج حساباً.</p>
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field">اسم المستخدم <input type="text" name="username" autocomplete="username" required autofocus dir="ltr"></label>
    <label class="field">كلمة المرور <input type="password" name="password" autocomplete="current-password" required dir="ltr"></label>
    <button class="btn btn-primary" type="submit">دخول</button>
  </form>
  <p class="muted">ليس لديك حساب؟ <a href="{{ url_for('register') }}">أنشئ حساباً جديداً</a></p>
</section>
{% endblock %}
