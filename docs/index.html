<script type="application/json" id="pages-data">{"home": "\u003csection class=\"hero\">\n  \u003cdiv class=\"hero-text\">\n    \u003cp class=\"eyebrow data\">\u003cspan data-set=\"title_en\">Machine Learning-Based Anomaly Detection in IoT\u003c/span>\u003c/p>\n    \u003ch1>رقيب يراقب أجهزة إنترنت الأشياء ويكشف الهجمات بتعلّم الآلة\u003c/h1>\n    \u003cp class=\"lead\">ثلاثة نماذج تحكم على كل سجل حركة يرسله الجهاز: Isolation Forest و Autoencoder يتعلمان شكل الحركة الطبيعية فقط، و Random Forest يتعلم من أمثلة الهجمات. القرار بتصويت الأغلبية، والحادثة تُفتح عندما يستمر الشذوذ.\u003c/p>\n    \u003cdiv class=\"control-row\">\n      \u003ca class=\"btn btn-primary\" href=\"#live\">ابدأ المراقبة الحية\u003c/a>\n      \u003ca class=\"btn\" href=\"#about\">اقرأ عن البحث\u003c/a>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"hero-card panel\" aria-label=\"نتائج المختبر\">\n    \u003ch2 class=\"panel-title\">من نتائج المختبر\u003c/h2>\n    \u003cdiv class=\"score-list\">\n      \n      \u003cdiv class=\"score\">\u003cspan>\u003ci class=\"sw sw-if\">\u003c/i>Isolation Forest\u003c/span>\u003cb class=\"data\">F1 0.872\u003c/b>\u003c/div>\n      \n      \u003cdiv class=\"score\">\u003cspan>\u003ci class=\"sw sw-ae\">\u003c/i>Autoencoder\u003c/span>\u003cb class=\"data\">F1 0.940\u003c/b>\u003c/div>\n      \n      \u003cdiv class=\"score\">\u003cspan>\u003ci class=\"sw sw-rf\">\u003c/i>Random Forest\u003c/span>\u003cb class=\"data\">F1 0.972\u003c/b>\u003c/div>\n      \n      \u003cdiv class=\"score\">\u003cspan>\u003ci class=\"sw sw-vote\">\u003c/i>تصويت الأغلبية\u003c/span>\u003cb class=\"data\">F1 0.958\u003c/b>\u003c/div>\n      \n    \u003c/div>\n    \n    \u003cp class=\"note\">هجوم «تسريب البيانات» عندما أخفيناه عن Random Forest كشف منه 5٪، وكشف Autoencoder 75٪.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"panel\">\n  \u003ch2 class=\"panel-title\">كيف يعمل\u003c/h2>\n  \u003col class=\"steps\">\n    \u003cli>\u003cb>جمع الحركة\u003c/b>\u003cspan>كل جهاز يرسل كل ثانية سجلاً فيه تسع خصائص، مثل معدل الحزم وعدد المنافذ ونسبة الاتصالات الفاشلة.\u003c/span>\u003c/li>\n    \u003cli>\u003cb>تجهيز البيانات\u003c/b>\u003cspan>تحويل النصوص إلى أعمدة، ولوغاريتم القيم الكبيرة، وتوحيد المقياس بقواعد تُتعلَّم من التدريب فقط.\u003c/span>\u003c/li>\n    \u003cli>\u003cb>ثلاثة نماذج\u003c/b>\u003cspan>كل نموذج يعطي درجة خطر من 0 إلى 100، والعتبة 50 عند المئين 99 من الحركة الطبيعية.\u003c/span>\u003c/li>\n    \u003cli>\u003cb>القرار والحوادث\u003c/b>\u003cspan>الإنذار عندما يتفق نموذجان، والحادثة تُفتح بإنذارين من آخر ثلاثة سجلات وتُحفظ في قاعدة البيانات.\u003c/span>\u003c/li>\n  \u003c/ol>\n\u003c/section>\n\n\u003csection class=\"features\">\n  \u003ca class=\"panel feature\" href=\"#live\">\u003cb>المراقبة الحية\u003c/b>\u003cspan>اثنا عشر جهازاً، ومحاكي هجمات، وتفسير لسبب كل إنذار.\u003c/span>\u003c/a>\n  \u003ca class=\"panel feature\" href=\"#lab\">\u003cb>المختبر\u003c/b>\u003cspan>Accuracy و F1 و ROC-AUC ومصفوفات الالتباس على 27,000 سجل.\u003c/span>\u003c/a>\n  \u003ca class=\"panel feature\" href=\"#data\">\u003cb>بياناتك\u003c/b>\u003cspan>ارفع ملف CSV من CICIoT2023 أو TON_IoT واحصل على تقرير كامل.\u003c/span>\u003c/a>\n  \u003ca class=\"panel feature\" href=\"#incidents\">\u003cb>سجل الحوادث\u003c/b>\u003cspan>كل حادثة مغلقة محفوظة في قاعدة البيانات مع حقيقتها ومن أطلق الهجوم.\u003c/span>\u003c/a>\n  \u003ca class=\"panel feature\" href=\"#reports\">\u003cb>التقارير\u003c/b>\u003cspan>تقارير تحليل ملفاتك محفوظة لكل مستخدم، مع الأشكال.\u003c/span>\u003c/a>\n  \u003ca class=\"panel feature\" href=\"#register\">\u003cb>الحسابات\u003c/b>\u003cspan>تسجيل دخول بكلمات مرور مشفّرة، وصلاحيات مدير ومحلل.\u003c/span>\u003c/a>\n\u003c/section>", "about": "\u003csection class=\"view-head\">\n  \u003cp class=\"eyebrow data\">\u003cspan data-set=\"title_en\">Machine Learning-Based Anomaly Detection in IoT\u003c/span>\u003c/p>\n  \u003ch1>\u003cspan data-set=\"title_ar\">كشف الشذوذ في شبكات إنترنت الأشياء باستخدام تعلّم الآلة\u003c/span>\u003c/h1>\n\u003c/section>\n\u003carticle class=\"panel prose\">\n  \u003ch2>الملخص\u003c/h2>\n  \u003cp>تنتشر أجهزة إنترنت الأشياء مثل الكاميرات ومنظّمات الحرارة والمقابس الذكية في البيوت والجامعات، وكثير منها ضعيف الحماية، فيستغلها المهاجمون في الإغراق وفحص المنافذ وتخمين كلمات المرور وتسريب البيانات. يقدّم هذا البحث نظام «رقيب» الذي يكشف السلوك الشاذ في حركة هذه الأجهزة بثلاثة نماذج تعلّم آلة، ويقارن بينها على بيانات محاكاة وبيانات حقيقية، ثم يطبقها في مراقبة حية تفتح الحوادث وتحفظها.\u003c/p>\n\n  \u003ch2>المشكلة\u003c/h2>\n  \u003cp>أنظمة الكشف المعتمدة على التواقيع تعرف الهجمات المسجلة مسبقاً فقط، والنماذج المُشرفة تحتاج أمثلة مصنّفة لكل هجوم. أما الهجوم الجديد (Zero-day) فقد يمر دون إنذار. والمطلوب نظام يكشف الهجمات المعروفة بدقة، ولا يعمى عن الجديدة، ويبقي الإنذارات الكاذبة قليلة.\u003c/p>\n\n  \u003ch2>الأهداف\u003c/h2>\n  \u003cul>\n    \u003cli>بناء محاكٍ لحركة أجهزة إنترنت الأشياء فيه سلوك طبيعي لكل نوع جهاز وأربعة هجمات بنسختين صاخبة وخفية.\u003c/li>\n    \u003cli>تدريب ثلاثة نماذج: Isolation Forest و Autoencoder (غير مُشرفين) و Random Forest (مُشرف)، ومقارنتها بمقاييس Accuracy و Precision و Recall و F1 و ROC-AUC ومعدل الإنذار الكاذب.\u003c/li>\n    \u003cli>قياس قدرة كل نموذج على كشف هجوم لم يره أثناء التدريب.\u003c/li>\n    \u003cli>تطبيق النماذج في موقع يراقب الأجهزة لحظياً، ويحفظ الحوادث والتقارير في قاعدة بيانات بحسابات مستخدمين.\u003c/li>\n  \u003c/ul>\n\n  \u003ch2>المنهجية\u003c/h2>\n  \u003ch3>البيانات\u003c/h3>\n  \u003cp>27,000 سجل محاكى (22٪ منها هجمات)، لكل سجل نوع الجهاز والبروتوكول وتسع خصائص رقمية. ويقبل الموقع كذلك ملفات حقيقية مثل CICIoT2023 و TON_IoT و UNSW-NB15، فيحذف المعرّفات والتصنيفات الإضافية تلقائياً حتى لا تتسرب الإجابة للنموذج.\u003c/p>\n  \u003ch3>المعالجة المسبقة\u003c/h3>\n  \u003cp>تحويل الأعمدة النصية بطريقة One-Hot، وأخذ لوغاريتم القيم الموجبة، ثم التوحيد بالمتوسط والانحراف المعياري. كل القواعد تُتعلَّم من بيانات التدريب فقط، والتقسيم 70٪ تدريب و30٪ اختبار مع الحفاظ على نسبة الهجمات.\u003c/p>\n  \u003ch3>النماذج\u003c/h3>\n  \u003cul>\n    \u003cli>\u003cb>Isolation Forest:\u003c/b> 200 شجرة عزل تُدرَّب على الحركة الطبيعية؛ السجل الشاذ يُعزل بتقسيمات أقل.\u003c/li>\n    \u003cli>\u003cb>Autoencoder:\u003c/b> شبكة عصبية بطبقات 32-16-8-16-32 تتعلم إعادة بناء الحركة الطبيعية، مع إيقاف مبكر؛ خطأ إعادة البناء الكبير يعني شذوذاً.\u003c/li>\n    \u003cli>\u003cb>Random Forest:\u003c/b> 200 شجرة قرار تتعلم من الأمثلة المصنّفة، بأوزان متوازنة للأصناف، وتعطي نوع الهجوم أيضاً.\u003c/li>\n  \u003c/ul>\n  \u003cp>كل نموذج يعطي درجة خطر من 0 إلى 100، والعتبة 50 تقابل المئين 99 من درجات الحركة الطبيعية. القرار النهائي بتصويت الأغلبية، والحادثة تُفتح بإنذارين من آخر ثلاثة سجلات وتُغلق بعد ثلاثة سجلات طبيعية.\u003c/p>\n\n  \u003ch2>النتائج على بيانات الاختبار\u003c/h2>\n  \u003cdiv class=\"tbl-wrap\">\n    \u003ctable class=\"tbl\">\n      \u003cthead>\u003ctr>\u003cth>النموذج\u003c/th>\u003cth>Precision\u003c/th>\u003cth>Recall\u003c/th>\u003cth>F1\u003c/th>\u003cth>ROC-AUC\u003c/th>\u003cth>FPR\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \n        \u003ctr>\u003ctd>\u003ci class=\"sw sw-if\">\u003c/i>Isolation Forest\u003c/td>\u003ctd class=\"data\">0.961\u003c/td>\u003ctd class=\"data\">0.798\u003c/td>\u003ctd class=\"data\">0.872\u003c/td>\u003ctd class=\"data\">0.970\u003c/td>\u003ctd class=\"data\">0.009\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003ctd>\u003ci class=\"sw sw-ae\">\u003c/i>Autoencoder\u003c/td>\u003ctd class=\"data\">0.958\u003c/td>\u003ctd class=\"data\">0.923\u003c/td>\u003ctd class=\"data\">0.940\u003c/td>\u003ctd class=\"data\">0.977\u003c/td>\u003ctd class=\"data\">0.011\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003ctd>\u003ci class=\"sw sw-rf\">\u003c/i>Random Forest\u003c/td>\u003ctd class=\"data\">0.969\u003c/td>\u003ctd class=\"data\">0.975\u003c/td>\u003ctd class=\"data\">0.972\u003c/td>\u003ctd class=\"data\">0.997\u003c/td>\u003ctd class=\"data\">0.009\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003ctd>\u003ci class=\"sw sw-vote\">\u003c/i>تصويت الأغلبية\u003c/td>\u003ctd class=\"data\">0.989\u003c/td>\u003ctd class=\"data\">0.928\u003c/td>\u003ctd class=\"data\">0.958\u003c/td>\u003ctd class=\"data\">0.987\u003c/td>\u003ctd class=\"data\">0.003\u003c/td>\u003c/tr>\n        \n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \n  \u003cp>أدق نموذج مع الهجمات المعروفة هو Random Forest، لكن عندما أخفينا هجوم «تسريب البيانات» عنه أثناء التدريب كشف 5٪ منه فقط، بينما كشفه Autoencoder بنسبة 75٪. لذلك يجمع رقيب النماذج الثلاثة: المُشرف للدقة، وغير المُشرف لاكتشاف الجديد.\u003c/p>\n\n  \u003ch2>القيود والعمل المستقبلي\u003c/h2>\n  \u003cul>\n    \u003cli>البيانات المحاكاة أبسط من الشبكات الحقيقية، لذلك يتيح الموقع رفع مجموعات بيانات حقيقية للمقارنة.\u003c/li>\n    \u003cli>يمكن مستقبلاً ربط رقيب بحركة شبكة حقيقية عبر أدوات مثل CICFlowMeter، وإضافة نماذج تتابعية مثل LSTM.\u003c/li>\n    \u003cli>يمكن إرسال تنبيه بالبريد أو تيليجرام عند فتح حادثة.\u003c/li>\n  \u003c/ul>\n  \u003cp class=\"note\">الكلمات المفتاحية: إنترنت الأشياء، كشف الشذوذ، تعلّم الآلة، Isolation Forest، Autoencoder، Random Forest، الهجوم المجهول.\u003c/p>\n\u003c/article>", "references": "\u003csection class=\"view-head\">\n  \u003ch1>المراجع\u003c/h1>\n  \u003cp>المصادر التي بُنيت عليها النماذج ومجموعات البيانات في هذا البحث، بأسلوب APA.\u003c/p>\n\u003c/section>\n\u003csection class=\"panel\">\n  \u003col class=\"refs\">\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Liu, F. T., Ting, K. M., &amp; Zhou, Z.-H. (2008). Isolation Forest. In Proceedings of the 8th IEEE International Conference on Data Mining (ICDM), 413–422. \u003ca href=\"https://doi.org/10.1109/ICDM.2008.17\" target=\"_blank\" rel=\"noopener\">doi:10.1109/ICDM.2008.17\u003c/a>\u003c/p>\n      \u003cp class=\"muted\">أساس نموذج Isolation Forest.\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Breiman, L. (2001). Random Forests. Machine Learning, 45(1), 5–32. \u003ca href=\"https://doi.org/10.1023/A:1010933404324\" target=\"_blank\" rel=\"noopener\">doi:10.1023/A:1010933404324\u003c/a>\u003c/p>\n      \u003cp class=\"muted\">أساس نموذج Random Forest.\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Hinton, G. E., &amp; Salakhutdinov, R. R. (2006). Reducing the dimensionality of data with neural networks. Science, 313(5786), 504–507. \u003ca href=\"https://doi.org/10.1126/science.1127647\" target=\"_blank\" rel=\"noopener\">doi:10.1126/science.1127647\u003c/a>\u003c/p>\n      \u003cp class=\"muted\">فكرة Autoencoder وعنق الزجاجة.\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Chandola, V., Banerjee, A., &amp; Kumar, V. (2009). Anomaly detection: A survey. ACM Computing Surveys, 41(3), Article 15. \u003ca href=\"https://doi.org/10.1145/1541880.1541882\" target=\"_blank\" rel=\"noopener\">doi:10.1145/1541880.1541882\u003c/a>\u003c/p>\n      \u003cp class=\"muted\">تعريف الشذوذ وأنواع طرق كشفه.\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Meidan, Y., Bohadana, M., Mathov, Y., Mirsky, Y., Shabtai, A., Breitenbacher, D., &amp; Elovici, Y. (2018). N-BaIoT: Network-based detection of IoT botnet attacks using deep autoencoders. IEEE Pervasive Computing, 17(3), 12–22.\u003c/p>\n      \u003cp class=\"muted\">Autoencoder لكشف هجمات شبكات البوت في أجهزة إنترنت الأشياء.\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Mirsky, Y., Doitshman, T., Elovici, Y., &amp; Shabtai, A. (2018). Kitsune: An ensemble of autoencoders for online network intrusion detection. In Network and Distributed System Security Symposium (NDSS).\u003c/p>\n      \u003cp class=\"muted\">كشف التسلل لحظياً بمجموعة Autoencoders.\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Antonakakis, M., et al. (2017). Understanding the Mirai botnet. In Proceedings of the 26th USENIX Security Symposium, 1093–1110.\u003c/p>\n      \u003cp class=\"muted\">هجمات أجهزة إنترنت الأشياء عبر Telnet وكلمات المرور الضعيفة.\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Neto, E. C. P., Dadkhah, S., Ferreira, R., Zohourian, A., Lu, R., &amp; Ghorbani, A. A. (2023). CICIoT2023: A real-time dataset and benchmark for large-scale attacks in IoT environment. Sensors, 23(13), 5941. \u003ca href=\"https://doi.org/10.3390/s23135941\" target=\"_blank\" rel=\"noopener\">doi:10.3390/s23135941\u003c/a>\u003c/p>\n      \u003cp class=\"muted\">مجموعة بيانات حقيقية تقبلها صفحة «بياناتك».\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Moustafa, N. (2021). A new distributed architecture for evaluating AI-based security systems at the edge: Network TON_IoT datasets. Sustainable Cities and Society, 72, 102994. \u003ca href=\"https://doi.org/10.1016/j.scs.2021.102994\" target=\"_blank\" rel=\"noopener\">doi:10.1016/j.scs.2021.102994\u003c/a>\u003c/p>\n      \u003cp class=\"muted\">مجموعة بيانات TON_IoT.\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Moustafa, N., &amp; Slay, J. (2015). UNSW-NB15: A comprehensive data set for network intrusion detection systems. In Military Communications and Information Systems Conference (MilCIS), 1–6.\u003c/p>\n      \u003cp class=\"muted\">مجموعة بيانات UNSW-NB15.\u003c/p>\n    \u003c/li>\n    \n    \u003cli>\n      \u003cp class=\"ref-text\" dir=\"ltr\">Pedregosa, F., et al. (2011). Scikit-learn: Machine learning in Python. Journal of Machine Learning Research, 12, 2825–2830.\u003c/p>\n      \u003cp class=\"muted\">المكتبة التي بُنيت بها النماذج الثلاثة.\u003c/p>\n    \u003c/li>\n    \n  \u003c/ol>\n\u003c/section>"}</script>
